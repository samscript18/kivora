name: Kivora CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [frontend, backend] }
    defaults: { run: { working-directory: "${{ matrix.app }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "${{ matrix.app }}/package-lock.json" }
      - run: npm ci
      - run: npm run build
      - run: npm test -- --passWithNoTests
        if: matrix.app == 'backend'
      - run: npm run lint
        if: matrix.app == 'frontend'
